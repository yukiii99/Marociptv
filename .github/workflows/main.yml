
name: Build Marociptv APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les outils Android
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Installer Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compiler Marociptv
        run: gradle --no-daemon assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Marociptv-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
